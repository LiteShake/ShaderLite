# ============================================================
# RENDERING FEATURES
# ============================================================
depthtex1 = true
shadow.enabled = true
shadowTerrain = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true

# ============================================================
# SHADER PACK SETTINGS
# ============================================================
screen=PALETTE SHADOWS DEBUG_SHADOWS <empty> TEXTURES TEXTURE_STRENGTH <empty> GRID GRID_MODE GRID_DENSITY GRID_SIDES <empty> ORTHO_VIEW ORTHO_SIZE ORTHO_FADE ORTHO_FADE_RADIUS ORTHO_FADE_LENGTH ORTHO_FADE_OPACITY

# Higher resolution shadow map for cleaner edges
shadowTranslucent=false
# shadowDistance=64.0

# Orthographic view: Minecraft culls chunks with the normal perspective camera,
# which hides the near side of the screen. Turn that off while ortho is on.
#ifdef ORTHO_VIEW
frustum.culling=false
occlusion.culling=false
#endif